name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # IfcOpenShell publishes wheels for 3.10-3.12 only (ADR-005).
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        # Live LLM tests are opt-in only (BIMI_LIVE_LLM=1) and never run in CI (C-06).
        run: pytest -q

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format
        working-directory: frontend
        run: npm run format:check
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Contract types are current
        # Fails when frontend/src/api/generated/types.ts is stale relative to the committed
        # JSON Schema (ADR-014). The backend job's pytest covers Pydantic → JSON Schema drift.
        working-directory: frontend
        run: npm run types:check
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse private or runtime artefacts
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(hackathon-private/|data/|\.env$)'; then
            echo "::error::Private or runtime files are tracked"; exit 1
          fi
          if git ls-files | grep -E '\.ifc$' | grep -vE '^(tests/fixtures/|datasets/(synthetic|permitted)/)'; then
            echo "::error::IFC files are only permitted under tests/fixtures/ or datasets/"; exit 1
          fi
          echo "OK"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
